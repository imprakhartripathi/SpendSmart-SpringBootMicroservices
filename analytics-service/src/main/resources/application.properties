spring.application.name=analytics-service
server.port=${SERVER_PORT:8086}
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spendsmart_analytics}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.services.expense-url=${EXPENSE_SERVICE_URL:http://expense-service}
app.services.income-url=${INCOME_SERVICE_URL:http://income-service}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

spring.cache.type=${CACHE_TYPE:simple}
spring.cache.redis.time-to-live=${ANALYTICS_CACHE_TTL:120s}
spring.cache.redis.cache-null-values=false
