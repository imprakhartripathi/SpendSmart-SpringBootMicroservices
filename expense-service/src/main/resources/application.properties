spring.application.name=expense-service
server.port=${SERVER_PORT:8082}
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spendsmart_expense}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.services.budget-url=${BUDGET_SERVICE_URL:http://budget-service}
app.services.auth-url=${AUTH_SERVICE_URL:http://auth-service}
app.services.income-url=${INCOME_SERVICE_URL:http://income-service}

spring.rabbitmq.host=${RABBITMQ_HOST:}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
app.messaging.enabled=${APP_MESSAGING_ENABLED:false}

app.messaging.exchange=${RABBITMQ_EXCHANGE:spendsmart.events}
app.messaging.routing.big-expense=${RABBITMQ_ROUTING_BIG_EXPENSE:email.big-expense}

app.rules.big-expense-threshold-percent=${BIG_EXPENSE_THRESHOLD_PERCENT:20}
app.rules.big-expense-average-months=${BIG_EXPENSE_AVERAGE_MONTHS:6}
