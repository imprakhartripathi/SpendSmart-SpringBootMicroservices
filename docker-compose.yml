services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spendsmart_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: config-server
        PORT: 8888
    env_file:
      - ./env/docker/common.env
      - ./env/docker/config-server.env
    ports:
      - "8888:8888"
    restart: unless-stopped

  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: discovery-server
        PORT: 8761
    env_file:
      - ./env/docker/common.env
      - ./env/docker/discovery-server.env
    ports:
      - "8761:8761"
    depends_on:
      - config-server
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
        PORT: 8080
    env_file:
      - ./env/docker/common.env
      - ./env/docker/api-gateway.env
    ports:
      - "8080:8080"
    depends_on:
      - config-server
      - discovery-server
      - auth-service
      - expense-service
      - income-service
      - category-service
      - budget-service
      - analytics-service
      - recurring-service
      - notification-service
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: auth-service
        PORT: 8081
    env_file:
      - ./env/docker/common.env
      - ./env/docker/auth-service.env
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
    restart: unless-stopped

  expense-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: expense-service
        PORT: 8082
    env_file:
      - ./env/docker/common.env
      - ./env/docker/expense-service.env
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
    restart: unless-stopped

  income-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: income-service
        PORT: 8083
    env_file:
      - ./env/docker/common.env
      - ./env/docker/income-service.env
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
    restart: unless-stopped

  category-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: category-service
        PORT: 8084
    env_file:
      - ./env/docker/common.env
      - ./env/docker/category-service.env
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
    restart: unless-stopped

  budget-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: budget-service
        PORT: 8085
    env_file:
      - ./env/docker/common.env
      - ./env/docker/budget-service.env
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      notification-service:
        condition: service_started
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: analytics-service
        PORT: 8086
    env_file:
      - ./env/docker/common.env
      - ./env/docker/analytics-service.env
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
    restart: unless-stopped

  recurring-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: recurring-service
        PORT: 8087
    env_file:
      - ./env/docker/common.env
      - ./env/docker/recurring-service.env
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: notification-service
        PORT: 8088
    env_file:
      - ./env/docker/common.env
      - ./env/docker/notification-service.env
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
