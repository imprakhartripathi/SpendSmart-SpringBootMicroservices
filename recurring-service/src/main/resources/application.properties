spring.application.name=recurring-service
server.port=${SERVER_PORT:8087}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spendsmart_recurring}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.services.expense-url=${EXPENSE_SERVICE_URL:http://localhost:8082}
app.services.income-url=${INCOME_SERVICE_URL:http://localhost:8083}
app.services.notification-url=${NOTIFICATION_SERVICE_URL:http://localhost:8088}
app.scheduling.recurring-reminder-cron=${RECURRING_REMINDER_CRON:0 30 8 * * *}
