spring.application.name=recurring-service
server.port=${SERVER_PORT:8087}
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spendsmart_recurring}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.services.expense-url=${EXPENSE_SERVICE_URL:http://expense-service}
app.services.income-url=${INCOME_SERVICE_URL:http://income-service}
app.services.notification-url=${NOTIFICATION_SERVICE_URL:http://notification-service}
app.services.auth-url=${AUTH_SERVICE_URL:http://auth-service}
app.scheduling.recurring-reminder-cron=${RECURRING_REMINDER_CRON:0 30 8 * * *}

spring.rabbitmq.host=${RABBITMQ_HOST:}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
app.messaging.enabled=${APP_MESSAGING_ENABLED:false}

app.messaging.exchange=${RABBITMQ_EXCHANGE:spendsmart.events}
app.messaging.routing.autopay=${RABBITMQ_ROUTING_AUTOPAY:email.autopay}
