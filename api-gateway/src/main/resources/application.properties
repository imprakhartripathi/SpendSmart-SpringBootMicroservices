spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

spring.cloud.gateway.discovery.locator.enabled=${GATEWAY_DISCOVERY_LOCATOR_ENABLED:false}
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Headers Access-Control-Allow-Methods

springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[0].url=/swagger/auth-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=expense-service
springdoc.swagger-ui.urls[1].url=/swagger/expense-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=income-service
springdoc.swagger-ui.urls[2].url=/swagger/income-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=category-service
springdoc.swagger-ui.urls[3].url=/swagger/category-service/v3/api-docs
springdoc.swagger-ui.urls[4].name=budget-service
springdoc.swagger-ui.urls[4].url=/swagger/budget-service/v3/api-docs
springdoc.swagger-ui.urls[5].name=analytics-service
springdoc.swagger-ui.urls[5].url=/swagger/analytics-service/v3/api-docs
springdoc.swagger-ui.urls[6].name=recurring-service
springdoc.swagger-ui.urls[6].url=/swagger/recurring-service/v3/api-docs
springdoc.swagger-ui.urls[7].name=notification-service
springdoc.swagger-ui.urls[7].url=/swagger/notification-service/v3/api-docs

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URI:lb://auth-service}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth,/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[0].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin, RETAIN_FIRST

spring.cloud.gateway.routes[1].id=auth-service-openapi
spring.cloud.gateway.routes[1].uri=${AUTH_SERVICE_URI:lb://auth-service}
spring.cloud.gateway.routes[1].predicates[0]=Path=/swagger/auth-service/v3/api-docs,/swagger/auth-service/v3/api-docs/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=2
spring.cloud.gateway.routes[1].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin, RETAIN_FIRST

